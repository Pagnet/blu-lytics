name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    uses: Pagnet/github-actions/.github/workflows/claude-code.yml@main
    secrets: inherit

  claude-review:
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false
    uses: Pagnet/github-actions/.github/workflows/claude-review.yml@main
    with:
      repo_description: 'Este repositorio e a biblioteca @useblu/blu-lytics (TypeScript, publicada no npm via semantic-release), ponto unico de entrada de analytics/monitoramento dos frontends da Blu, com providers para Mixpanel, Clarity, FullStory, Sentry e Statsig.'
      block_on_security: true
      allowed_bots: 'devin-ai-integration,github-actions'
    secrets: inherit

  claude-auto-fix:
    needs: claude-review
    if: |
      !cancelled() &&
      (needs.claude-review.result == 'success' || needs.claude-review.result == 'failure') &&
      !contains(github.event.pull_request.user.login, 'devin-ai-integration') &&
      !contains(toJSON(github.event.pull_request.labels.*.name), 'claude-auto-fix')
    uses: Pagnet/github-actions/.github/workflows/claude-auto-fix.yml@main
    secrets: inherit
